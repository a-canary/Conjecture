name: Release gate

# Cadence hook for the small-model do-no-harm gate (CHOICES.md O-0008
# Amendment 2026-08-04). Checks that a gate run HAPPENED, recently, on every
# pinned model, and passed — it does not run the benchmark itself (that needs
# paid API calls and hours; CI has neither). Absent evidence blocks the
# release rather than reading as consent.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check recorded gate
        run: python -m benchmarks.deepeval_suite --check-gate
